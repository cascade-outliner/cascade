name: a11y

# Runs axe-core accessibility scans (apps/web-app/e2e/a11y.spec.ts) against
# the main tree view and the Settings dialog (desktop and mobile
# full-screen layouts), then posts/updates a single comment on the PR with
# the results (see e2e/a11y-report.ts). Critical/serious violations fail
# the job itself; the comment is posted either way so results are visible
# without digging into CI logs. See issue #595.
on:
  pull_request:
    paths:
      - "apps/web-app/**"
      - "packages/outliner/**"
      - "packages/ui/**"
      - "packages/theme/**"
      - "packages/auth/**"
      - "packages/http/**"
      - ".github/workflows/a11y.yml"

env:
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/cascade
  BETTER_AUTH_SECRET: ci-only-secret-do-not-use-in-production-1234
  BETTER_AUTH_URL: http://localhost:3001
  PORT: 3001

jobs:
  a11y:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cascade
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Apply database schema
        run: pnpm db:migrate:app

      - run: pnpm --filter app exec playwright install --with-deps chromium

      # Runs on its own (not via test:e2e:app) so it can fail this job
      # without failing the general e2e job, and so a11y results land in
      # their own PR comment. Continues to the report/comment steps below
      # even on failure so results are visible either way.
      - name: Run accessibility scan
        id: a11y-scan
        run: pnpm test:a11y:app
        continue-on-error: true

      - name: Build report
        if: always()
        run: |
          pnpm --filter app a11y:report -- --out="$RUNNER_TEMP/a11y-report.md"

      - name: Upload raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-results
          path: |
            apps/web-app/a11y-results/
            apps/web-app/playwright-report/
            ${{ runner.temp }}/a11y-report.md
          if-no-files-found: warn
          retention-days: 30

      - name: Comment on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("node:fs");
            const body = fs.readFileSync(process.env.RUNNER_TEMP + "/a11y-report.md", "utf-8");
            const marker = "<!-- a11y-report -->";

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail the job if the scan failed
        if: steps.a11y-scan.outcome == 'failure'
        run: exit 1
