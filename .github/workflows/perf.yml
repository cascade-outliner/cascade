name: perf

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

# A new push supersedes the running measurement.
concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  perf:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: playwright
        run: echo "version=$(pnpm --filter @cascade/web-app exec playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --filter @cascade/web-app exec playwright install --with-deps chromium
      # The cache holds the browser only; its system libraries still need installing.
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm --filter @cascade/web-app exec playwright install-deps chromium
      - id: perf
        run: pnpm --filter @cascade/web-app test:perf
      - name: Write comment
        if: ${{ !cancelled() }}
        working-directory: apps/web-app
        env:
          OUTCOME: ${{ steps.perf.outcome }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          {
            echo "## Performance"
            if [ "$OUTCOME" = success ]; then
              echo "All budgets met."
            else
              echo "**Over budget or failed.** See the job log and the \`perf-report\` artifact."
            fi
            echo
            echo "Median of 5 runs, production build, 4× CPU throttle, commit \`${SHA:0:7}\`. CI runners are noisy: compare trends, not single values."
            for f in perf-results/*.json; do
              [ -e "$f" ] || { echo; echo "No results were recorded."; break; }
              echo
              jq -r '"### \(.test)\n\n| Metric | Value |\n| --- | --- |",
                (del(.test) | to_entries[] | "| \(.key) | \(.value * 10 | round / 10) |")' "$f"
            done
          } > perf-comment.md
      # Fork PRs get a read-only token, so they can't comment; the results are still in the artifact.
      - uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository }}
        with:
          header: perf
          path: apps/web-app/perf-comment.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: perf-report
          path: |
            apps/web-app/playwright-report/
            apps/web-app/perf-results/
            apps/web-app/test-results/
          retention-days: 14
