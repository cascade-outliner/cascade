name: coverage

# Runs the same Vitest suites as test.yml, with coverage instrumentation
# enabled, and posts/updates a single PR comment summarizing per-package
# coverage. Unlike perf.yml this only needs the head commit — coverage is a
# current-state metric, not a before/after comparison.
on:
  pull_request:

jobs:
  coverage:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage:outliner
      - run: pnpm test:coverage:ui
      - run: pnpm test:coverage:http
      - run: pnpm test:coverage:app
      - run: pnpm test:coverage:web

      - name: Build coverage report
        run: node scripts/coverage-report.mjs --out="$RUNNER_TEMP/coverage-report.md"

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("node:fs");
            const body = fs.readFileSync(process.env.RUNNER_TEMP + "/coverage-report.md", "utf-8");
            const marker = "<!-- coverage-report -->";

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
